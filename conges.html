<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAT - Formulaire Congés</title>
    <style>
        @import url('https://googleapis.com');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f4f6f9; color: #1e293b; }
        .navbar { background-color: #0d3b66; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .menu-links a { color: #94a3b8; padding: 10px 16px; text-decoration: none; font-weight: 600; border-radius: 8px; }
        .navbar .menu-links a.active { color: white; background-color: #0056b3; }
        
        .profile-container { position: relative; display: inline-block; }
        .avatar { width: 42px; height: 42px; background: #0056b3; color: white; font-weight: 700; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid white; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 50px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 140px; z-index: 100; overflow: hidden; }
        .dropdown-item { padding: 12px; font-size: 0.9rem; color: #334155; display: block; font-weight: 600; cursor: pointer; }
        .dropdown-item:hover { background: #f1f5f9; color: #ef4444; }

        .container { max-width: 900px; margin: 35px auto; padding: 0 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); margin-bottom: 30px; border: 1px solid #e2e8f0; }
        .card h2 { font-size: 1.4rem; font-weight: 700; color: #0f172a; margin-bottom: 15px; }
        .dates-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        label { display: block; margin: 12px 0 6px; font-weight: 600; color: #334155; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; }
        .btn-submit { background: linear-gradient(135deg, #0d3b66 0%, #0056b3 100%); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 20px; }
        .btn-back { display: inline-block; background: #e2e8f0; color: #334155; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 14px; text-align: left; }
        th { background-color: #f8fafc; color: #64748b; font-size: 0.85rem; text-transform: uppercase; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; display: inline-block; }
        .bg-waiting { background-color: #fef3c7; color: #d97706; }
        .bg-success { background-color: #dcfce7; color: #15803d; }
        .bg-danger { background-color: #f8d7da; color: #721c24; }
        .date-txt { font-size: 0.8rem; color: #64748b; display: block; margin-top: 4px; }
    </style>
</head>
<body>
<div class="navbar">
    <div class="menu-links"><a href="index.html">🕒 Mon Pointage</a><a class="active" href="choix_conges.html">📅 Mes Congés</a></div>
    <div class="profile-container">
        <div class="avatar" onclick="toggleMenu()">EM</div>
        <div class="dropdown-menu" id="avatarMenu"><span class="dropdown-item" onclick="sessionStorage.clear(); window.location.href='login.html';">🚪 Quitter</span></div>
    </div>
</div>
<div class="container">
    <a class="btn-back" href="choix_conges.html">⬅️ Retour</a>
    <div class="card">
        <h2>Créer une Demande pour : <span id="dynamicEmpName" style="color: #0d3b66;">...</span></h2>
        <form id="leaveRequestForm">
            <label>Type de congé :</label><select id="type_conge"><option>Congé Annuel Payé</option><option>Congé Maladie</option></select>
            <div class="dates-group">
                <div><label>Début :</label><input type="date" id="date_debut" required value="2026-10-05"></div>
                <div><label>Fin :</label><input type="date" id="date_fin" required value="2026-10-12"></div>
            </div>
            <button type="submit" class="btn-submit">Envoyer la demande</button>
        </form>
    </div>
    <div class="card">
        <h2>Historique de <span id="tableEmpName">...</span></h2>
        <table>
            <thead><tr><th>Type</th><th>Période</th><th>Statut Final RH</th></tr></thead>
            <tbody id="table-body-conges"></tbody>
        </table>
    </div>
</div>
<script>
    if (sessionStorage.getItem('userRole') !== 'EMPLOYE') { window.location.href = 'login.html'; }
    function toggleMenu() { const m = document.getElementById('avatarMenu'); m.style.display = m.style.display === "block" ? "none" : "block"; }
    document.addEventListener('click', function(e) { if (!e.target.closest('.profile-container')) { document.getElementById('avatarMenu').style.display = "none"; } });
    const urlParams = new URLSearchParams(window.location.search); const nom = urlParams.get('nom') || "Marc Durand"; const prenomClé = nom.split(' ')[0];
    document.getElementById('dynamicEmpName').innerText = nom; document.getElementById('tableEmpName').innerText = nom;
    function rafraichirTableau() {
        const tbody = document.getElementById('table-body-conges'); const aEnvoye = localStorage.getItem('demande_envoyee_' + prenomClé);
        if (aEnvoye === 'oui') {
            const type = localStorage.getItem('type_' + prenomClé); const deb = localStorage.getItem('deb_' + prenomClé); const fin = localStorage.getItem('fin_' + prenomClé);
            const decisionRH = localStorage.getItem('statut_' + prenomClé); const dateVal = localStorage.getItem('date_val_' + prenomClé);
            let badgeHtml = '<span class="badge bg-waiting">🟡 En attente</span>';
            if (decisionRH === 'Accepté') { badgeHtml = `<span class="badge bg-success">🟢 Validé</span><span class="date-txt">Le ${dateVal}</span>`; } 
            else if (decisionRH === 'Refusé') { badgeHtml = `<span class="badge bg-danger">🔴 Refusé</span><span class="date-txt">Le ${dateVal}</span>`; }
            tbody.innerHTML = `<tr><td>${type}</td><td>Du ${deb} au ${fin}</td><td>${badgeHtml}</td></tr>`;
        } else { tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#64748b;">Aucune demande.</td></tr>`; }
    }
    document.getElementById('leaveRequestForm').addEventListener('submit', function(e) {
        e.preventDefault();
        localStorage.setItem('demande_envoyee_' + prenomClé, 'oui');
        localStorage.setItem('type_' + prenomClé, document.getElementById('type_conge').value);
        localStorage.setItem('deb_' + prenomClé, document.getElementById('date_debut').value.split('-').reverse().join('/'));
        localStorage.setItem('fin_' + prenomClé, document.getElementById('date_fin').value.split('-').reverse().join('/'));
        localStorage.removeItem('statut_' + prenomClé); alert("Demande envoyée !"); rafraichirTableau();
    });
    rafraichirTableau();
</script>
</body>
</html>
